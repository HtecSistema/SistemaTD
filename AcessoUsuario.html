<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acessos</title>
<style>
*{box-sizing:border-box;}
body{margin:0; font-family:'Segoe UI', Inter, sans-serif; background:#f5f7ff; padding:0; display:flex; justify-content:flex-start; align-items:flex-start; min-height:100vh;}
.card{background:#fff; max-width:460px; width:100%; margin:0; border-radius:0 16px 16px 0; padding:12px; box-shadow:0 6px 20px rgba(0,0,0,0.06); border:1px solid #eef0f6; border-left:0;}
.card h2{margin:0 0 10px 0; font-size:14px; font-weight:800;}
.busca{width:100%; padding:9px 12px; border-radius:10px; border:2px solid #111; font-weight:700; font-size:12px; outline:none; margin-bottom:8px; text-transform:uppercase;}
.filtros-data{display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; align-items:center; background:#f9fafb; padding:8px; border-radius:8px; border:1px solid #e5e7eb;}
.filtros-data label{font-size:10px; font-weight:700;}
.filtros-data input[type="date"]{padding:6px 8px; border-radius:6px; border:1px solid #d1d5db; font-size:11px; flex:1;}
.filtros-data button{padding:6px 10px; border-radius:6px; border:none; font-weight:700; font-size:10px; cursor:pointer;}
.tabela{width:100%; border:1px solid #e5e7eb; border-radius:8px; overflow:hidden; display:flex; flex-direction:column;}
.tabela-header{display:flex; background:#111827; color:#fff; padding:7px 6px; font-size:9px; font-weight:800; text-transform:uppercase; min-width:560px;}
#lista{max-height:70vh; height:420px; overflow:auto;}
.linha{display:flex; align-items:center; padding:7px 6px; border-bottom:1px solid #f3f4f6; font-size:11px; background:#fff; cursor:pointer; min-width:560px;}
.linha:nth-child(even){background:#fafbff;}
.linha:hover{background:#e0e7ff!important;}

.col-cod{width:48px; min-width:48px; text-align:center;}
.col-mat{width:58px; min-width:58px; text-align:center; font-weight:600;}
.col-nome{flex:1; min-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding-right:8px;}
.col-data{width:78px; min-width:78px; text-align:center;}
.col-hora{width:48px; min-width:48px; text-align:center;}
.col-senha{width:82px; min-width:82px; text-align:center; font-family:monospace;}

.top-actions{display:flex; gap:6px; margin-bottom:10px;}
.top-actions button{padding:6px 10px; border-radius:8px; border:none; font-weight:700; font-size:10px; cursor:pointer;}
.btn-black{background:#111; color:#fff;}
.btn-white{background:#fff; border:1px solid #e5e7eb!important;}
.btn-blue{background:#2563eb; color:#fff;}
.btn-gray{background:#e5e7eb;}
</style>
</head>
<body>
<div class="card">
  <h2>Acesso de Usuários</h2>
  <div class="top-actions">
    <button class="btn-black" onclick="carregar()">🔄 ATUALIZAR</button>
    <button class="btn-white" onclick="exportarCSV()">📥 CSV</button>
    <span style="margin-left:auto; font-size:11px; background:#f3f4f6; padding:5px 10px; border-radius:20px;">Total: <b id="total">0</b></span>
  </div>
  <input type="text" id="buscar" class="busca" placeholder="BUSCAR NOME OU MAT..." oninput="filtrar()">
  <div class="filtros-data">
    <label>De:</label><input type="date" id="dataInicio">
    <label>Até:</label><input type="date" id="dataFim">
    <button class="btn-blue" onclick="filtrar()">FILTRAR</button>
    <button class="btn-gray" onclick="limparDatas()">LIMPAR</button>
  </div>
  <div class="tabela">
    <div class="tabela-header"><div class="col-cod">Cod</div><div class="col-mat">Mat</div><div class="col-nome">Nome</div><div class="col-data">Data</div><div class="col-hora">hora</div><div class="col-senha">SENHA</div></div>
    <div id="lista"><div style="padding:20px; text-align:center; color:#6b7280;">Clique em ATUALIZAR</div></div>
  </div>
</div>
<script>
const API_LOG = 'https://script.google.com/macros/s/AKfycbz94-3iCkeVDD7Za2XAYzYL7BtCM3rWWMxGc_9kL-xtpnRoog91IR4KmqgWzLXYHIsb/exec';
const API_DADOS = 'https://script.google.com/macros/s/AKfycbxLXw-nu5oXXtjE8HKik_W_bbT9CGjTNJWw-dUm4wWYv-hjcz1dOhMHLxoUTRHGJA3D0A/exec';
let dados = []; let dadosFiltrados = []; let mapaSenhas = {};
function normaliza5Dig(v){ return String(v||'').replace(/\D/g,'').padStart(5,'0').slice(-5); }
function soData(v){ if(!v) return ''; let s=String(v).trim(); if(s.includes('T')){ let d=s.split('T')[0]; let p=d.split('-'); if(p.length==3) return p[2]+'/'+p[1]+'/'+p[0]; return d; } if(s.includes('/') && s.length>=10) return s.substring(0,10); if(s.includes('-') && s.length>=10){ let p=s.substring(0,10).split('-'); if(p.length==3) return p[2]+'/'+p[1]+'/'+p[0]; } return s.substring(0,10); }
function soHora(v){ if(!v) return ''; let s=String(v).trim(); if(s.includes('T')){ let t=s.split('T')[1]; return t.substring(0,5); } if(s.includes(':')){ let partes = s.split(' '); let h = partes[partes.length-1]; return h.substring(0,5); } return s; }
function dataParaComparar(dataStr){ let s=soData(dataStr); if(!s) return null; let p=s.split('/'); if(p.length!=3) return null; return p[2]+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0'); }
async function carregar(){
  document.getElementById('lista').innerHTML='<div style="padding:20px;text-align:center">⏳ Carregando...</div>';
  try{
    let [rLog, rDados] = await Promise.all([ fetch(API_LOG+'?action=todosAcessos&t='+Date.now()), fetch(API_DADOS+'?action=todos&t='+Date.now()) ]);
    let jLog = await rLog.json(); let jDados = await rDados.json();
    dados = jLog.data||[]; mapaSenhas = {};
    (jDados.data||[]).forEach(x=>{
      let mat = normaliza5Dig(String(x.Matricula||'')); let sen = String(x.Senha||'').toUpperCase().trim();
      if(mat && sen) mapaSenhas[mat]=sen;
    });
    render(dados);
  }catch(e){ document.getElementById('lista').innerHTML='<div style="padding:20px;color:red;text-align:center">Erro: '+e.message+'</div>'; }
}
function render(lista){
  dadosFiltrados=lista; document.getElementById('total').innerText=lista.length;
  if(!lista.length){ document.getElementById('lista').innerHTML='<div style="padding:20px;text-align:center">Nenhum acesso</div>'; return; }
  document.getElementById('lista').innerHTML=lista.map(l=>{
    let d=l.Data||''; let h=l.Horario||''; let mat=normaliza5Dig(String(l.Matricula||'')); let s=mapaSenhas[mat]||'';
    return `<div class="linha"><div class="col-cod">${l.Cod||''}</div><div class="col-mat">${mat}</div><div class="col-nome" title="${l.Nome||''}">${l.Nome||''}</div><div class="col-data">${soData(d)}</div><div class="col-hora">${soHora(h)}</div><div class="col-senha">${s}</div></div>`;
  }).join('');
}
function filtrar(){ if(!dados.length){ carregar().then(()=>filtrarInterno()); return; } filtrarInterno(); }
function filtrarInterno(){
  let termo=document.getElementById('buscar').value.toUpperCase().trim(); let inicio=document.getElementById('dataInicio').value; let fim=document.getElementById('dataFim').value; let f=[...dados];
  if(termo){ f=f.filter(x=>{ let mat=normaliza5Dig(String(x.Matricula||'')); let sen=mapaSenhas[mat]||''; return mat.includes(termo)||String(x.Nome||'').toUpperCase().includes(termo)||sen.includes(termo); }); }
  if(inicio){ f=f.filter(x=>{let d=dataParaComparar(x.Data||x.data);return d&&d>=inicio;}); }
  if(fim){ f=f.filter(x=>{let d=dataParaComparar(x.Data||x.data);return d&&d<=fim;}); }
  render(f);
}
function limparDatas(){
  document.getElementById('dataInicio').value=''; document.getElementById('dataFim').value=''; document.getElementById('buscar').value='';
  dadosFiltrados=[]; document.getElementById('total').innerText='0'; document.getElementById('lista').innerHTML='<div style="padding:20px;text-align:center">Lista limpa - clique em ATUALIZAR</div>';
}
function exportarCSV(){
  let csv="Cod;Matricula;Nome;Data;horario;Senha\n";
  dadosFiltrados.forEach(l=>{ let mat=normaliza5Dig(String(l.Matricula||'')); let d=l.Data||''; let h=l.Horario||''; let s=mapaSenhas[mat]||''; csv+=`${l.Cod||''};${mat};${l.Nome||''};${soData(d)};${soHora(h)};${s}\n`; });
  let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='AcessoUsuario.csv';a.click();
}
</script>
</body>
</html>
