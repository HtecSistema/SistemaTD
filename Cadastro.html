<!DOCTYPE html>
<html>
<head>

</head>
<body>

<div id="listViewContainer">
  <div id="listViewBox">
    <div style="padding:8px 12px;display:flex;justify-content:space-between;align-items:left;background:#0f766e;color:white">
      <h3 id="listTitulo" style="margin:0;font-size:13px">📋 LISTA - SETA ↑↓ + ENTER ou DUPLO CLIQUE</h3>

    </div>
    <div style="padding:6px 12px;background:#f8fafc;border-bottom:1px solid #e2e8f0">
      <div style="font-size:10px;color:#64748b;font-weight:700;margin-bottom:4px">PESQUISAR POR CRITERIOS</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px">
        <input id="filtroNome" placeholder="NOME" oninput="debounceFiltrar()">

        <input id="filtroCongregacao" placeholder="CONGREGACAO" oninput="debounceFiltrar()">

<div class="container">

  <button class="btn btn-save" onclick="salvar()" style="flex:1;min-width:110px">💾 SALVAR</button>
  <button class="btn btn-clear" onclick="limpar()" style="flex:1;min-width:110px">🧹 LIMPAR</button>
  <button class="btn btn-search" onclick="buscar()" style="flex:1;min-width:110px">🔍 BUSCAR</button>
  <button class="btn btn-list" onclick="listar()" style="flex:1;min-width:110px;display:none">📋 Pré-Cadastro</button>
  <button class="btn" onclick="abrirTeste52()" style="background:#7c3aed;color:white;flex:1;min-width:110px">📝 TESTE</button>
  <button class="btn" onclick="recuperar()" style="background:#ea580c;color:white;flex:1;min-width:110px">♻️ RECUPERAR</button>
</div>

<div class="form-section"><div class="section-title">DADOS PRINCIPAIS</div>

<div>

    <span onclick="let i=document.getElementById('Senha'); i.type=i.type==='password'?'text':'password'; this.innerText=i.type==='password'?'👁️':'🙈'" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer">👁️</span>
  </div>
</div>
  <div><label>CODIGO</label><input id="Codigo" readonly></div>
  <div><label>LOGIN MAT</label><input id="MatriculaLogin" readonly style="background:#e2e8f0;font-weight:900;text-align:center"></div>
</div>
<div class="grid" style="grid-template-columns:1.2fr 0.6fr 1fr;margin-top:10px;align-items:end">
  <div><label>MATRICULA * PESQUISE</label><input id="Matricula" autocomplete="off"></div>
  <div><label style="opacity:0">.</label><button id="btnPesquiseMat" onclick="buscarMatriculaBD1()" style="width:100%;height:38px;background:#0f766e;color:white;border:none;border-radius:8px;font-weight:900;cursor:pointer">🔵 PESQUISE</button></div>
  <div><label>CPF *</label><input id="CPF" maxlength="11" autocomplete="off"></div>
</div>
<div class="grid" style="grid-template-columns:1fr;margin-top:10px">
  <div><label>NOME COMPLETO *</label><input id="Nome" autocomplete="off"></div>
</div>
<div class="grid" style="grid-template-columns:0.6fr 1fr 0.8fr;margin-top:10px">
  <div><label>SEXO *</label><div class="combo-wrap" id="wrap_Sexo"><input id="Sexo" class="combo-input"><div class="combo-arrow">▼</div><div class="combo-list" id="list_Sexo"></div></div></div>
  <div><label>WHATSAPP *</label><input id="WhatsApp" maxlength="11"></div>
  <div><label>NASCIMENTO * <span id="idadeDisplay"></span></label><input id="Nascimento" type="date"></div>
</div>
<div style="display:none"><input id="FaixaEtaria"></div>
<div class="grid" style="grid-template-columns:1fr;margin-top:10px">
  <div><label>NOME DA CONGREGAÇAO *</label><div class="combo-wrap" id="wrap_Congregacao"><input id="Congregacao" class="combo-input"><div class="combo-arrow">▼</div><div class="combo-list" id="list_Congregacao"></div></div></div>
</div>
<div class="grid" style="grid-template-columns:1fr;margin-top:10px"><div style="display:none"></div><div><label>NOME DA MAE</label><input id="Mae"></div></div>
</div>
<div class="form-section"><div class="section-title">DADOS PESSOAIS E ECLESIASTICOS</div>
<div class="grid" style="grid-template-columns:1fr 1fr;margin-top:10px"><div><label>SITUACAO CONJUGAL *</label><div class="combo-wrap" id="wrap_SitConjugal"><input id="SitConjugal" class="combo-input"><div class="combo-arrow">▼</div><div class="combo-list" id="list_SitConjugal"></div></div></div><div><label>CURSO TEOLOGICO *</label><div class="combo-wrap" id="wrap_Cteologico"><input id="Cteologico" class="combo-input"><div class="combo-arrow">▼</div><div class="combo-list" id="list_Cteologico"></div></div></div></div>
<div class="grid" style="grid-template-columns:1.3fr 1.3fr;margin-top:10px"><div><label>GRAU</label><div class="combo-wrap" id="wrap_GrauCurso"><input id="GrauCurso" class="combo-input"><div class="combo-arrow">▼</div><div class="combo-list" id="list_GrauCurso"></div></div></div><div><label>ANDAMENTO DO CURSO</label><div class="combo-wrap" id="wrap_Andamento"><input id="Andamento" class="combo-input"><div class="combo-arrow">▼</div><div class="combo-list" id="list_Andamento"></div></div></div></div>
<div style="display:none"><input id="RG"><input id="DataCasamento" type="date"><input id="Conjuge"><input id="DataTermino" type="date"></div>
<div class="grid" style="grid-template-columns:0.7fr 0.7fr 0.7fr;margin-top:10px"><div><label>MEMBRO *</label><div class="combo-wrap" id="wrap_BatizadoAgua"><input id="BatizadoAgua" class="combo-input"><div class="combo-arrow">▼</div><div class="combo-list" id="list_BatizadoAgua"></div></div></div><div><label>BT ESPIRITO SANTO *</label><div class="combo-wrap" id="wrap_EspSanto"><input id="EspSanto" class="combo-input"><div class="combo-arrow">▼</div><div class="combo-list" id="list_EspSanto"></div></div></div><div><label>FUNCAO ECLESIASTICA *</label><div class="combo-wrap" id="wrap_TFunEclesiastica"><input id="TFunEclesiastica" class="combo-input"><div class="combo-arrow">▼</div><div class="combo-list" id="list_TFunEclesiastica"></div></div></div></div>
<div class="grid" style="grid-template-columns:1fr 1fr;margin-top:10px"><div><label>QUAL FUNCAO</label><div class="combo-wrap" id="wrap_QualFuncao"><input id="QualFuncao" class="combo-input"><div class="combo-arrow">▼</div><div class="combo-list" id="list_QualFuncao"></div></div></div><div><label>FUNCAO NA CONGREGACAO</label><div class="combo-wrap" id="wrap_Fcongregacao"><input id="Fcongregacao" class="combo-input"><div class="combo-arrow">▼</div><div class="combo-list" id="list_Fcongregacao"></div></div></div></div>
<div class="grid" style="grid-template-columns:1fr 1fr;margin-top:10px"><div><label>DEPARTAMENTO</label><div class="combo-wrap" id="wrap_Departamentoinserido"><input id="Departamentoinserido" class="combo-input"><div class="combo-arrow">▼</div><div class="combo-list" id="list_Departamentoinserido"></div></div></div><div><label>FUNCAO DEPARTAMENTO</label><div class="combo-wrap" id="wrap_FuncaoDepartamento"><input id="FuncaoDepartamento" class="combo-input"><div class="combo-arrow">▼</div><div class="combo-list" id="list_FuncaoDepartamento"></div></div></div></div>
<div class="grid grid-1" style="margin-top:10px"><div><label>OUTRAS FUNCOES</label><div class="combo-wrap" id="wrap_OFuncoes"><input id="OFuncoes" class="combo-input"><div class="combo-arrow">▼</div><div class="combo-list" id="list_OFuncoes"></div></div></div></div>
</div>
<div class="form-section"><div class="section-title">ENDERECO</div>
<div class="grid" style="grid-template-columns:0.9fr 2.2fr 0.9fr"><div><label>CEP</label><input id="CEP" maxlength="8" onblur="buscarCEP(this.value)" oninput="if(this.value.replace(/\D/g,'').length==8) buscarCEP(this.value)"></div><div><label>ENDERECO</label><input id="end"></div><div><label>NUMERO</label><input id="Numero"></div></div>
<div class="grid grid-3" style="margin-top:10px"><div><label>BAIRRO</label><input id="Bairro"></div><div><label>COMPLEMENTO</label><input id="Complemento"></div><div><label>OBSERVACAO</label><input id="Observacao"></div></div>
<div class="grid grid-2" style="margin-top:10px"><div><label>UF ENDERECO</label><div class="combo-wrap" id="wrap_UfEndereco"><input id="UfEndereco" class="combo-input"><div class="combo-arrow">▼</div><div class="combo-list" id="list_UfEndereco"></div></div></div><div><label>CIDADE ENDERECO</label><div class="combo-wrap" id="wrap_CidadeEndereco"><input id="CidadeEndereco" class="combo-input"><div class="combo-arrow">▼</div><div class="combo-list" id="list_CidadeEndereco"></div></div></div></div>
<div class="grid grid-2" style="display:none"><div><label>ESTADO</label><div class="combo-wrap" id="wrap_Estado"><input id="Estado" class="combo-input"><div class="combo-arrow">▼</div><div class="combo-list" id="list_Estado"></div></div></div><div><label>CIDADE NASC</label><div class="combo-wrap" id="wrap_CidadeNascimento"><input id="CidadeNascimento" class="combo-input"><div class="combo-arrow">▼</div><div class="combo-list" id="list_CidadeNascimento"></div></div></div></div>
</div>

<div id="toast" class="toast"></div>
<div id="overlayTeste" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:99999"></div>
<script src="app.js"></script>

<script>
// SOMENTE 00425 HELIO VE O BOTAO BUSCAR
(function(){
  function verificaBuscar(){
    try{
      var mat = (localStorage.getItem('mat_logada')||'').replace(/\D/g,'').padStart(5,'0');
      var btn = document.querySelector('.btn-search');
      if(!btn) return;
      if(mat === '00425'){
        btn.style.display = '';
      } else {
        btn.style.display = 'none';
      }
    }catch(e){}
  }
  setTimeout(verificaBuscar, 300);
  setInterval(verificaBuscar, 1500);
})();
</script>

<script>
// === REGRA: ONDE TEM ▼ SÓ ACEITA O QUE ESTÁ NA LISTA - SALVAR E ALTERAR + AUTO PESQUISE 1 VEZ ===
(function(){
  var jaPesquisouAuto = false;

  function toastMsg(m){
    if(typeof showToast==='function'){ showToast(m); return; }
    var t=document.getElementById('toast');
    if(t){ t.textContent=m; t.className='toast show'; t.style.display='block'; setTimeout(function(){ t.style.display='none'; },3500); }
    else alert(m);
  }
  function getLista(idLista){
    var el=document.getElementById(idLista); if(!el) return [];
    return Array.from(el.children).map(function(o){ return (o.textContent||'').trim().toUpperCase(); }).filter(Boolean);
  }
  function validarCampo(input, avisar){
    if(!input ||!input.classList.contains('combo-input')) return true;
    var v=(input.value||'').trim(); if(!v) return true;
    var ops=getLista('list_'+input.id);
    if(ops.length===0) return true; // lista ainda não carregou, deixa passar por enquanto
    if(ops.indexOf(v.toUpperCase())===-1){
      if(avisar) toastMsg('❌ "'+v+'" não existe em '+input.id+'. Onde tem ▼ só aceita da lista.');
      input.value=''; input.style.border='2px solid #ef4444'; input.style.background='#fef2f2';
      input.focus();
      return false;
    }
    input.style.border=''; input.style.background=''; return true;
  }
  function validarTodosCampos(avisar){
    var todos=document.querySelectorAll('.combo-input');
    for(var i=0;i<todos.length;i++){
      if(!validarCampo(todos[i], avisar)) return false;
    }
    return true;
  }

  // trava na digitação, blur, change, paste
  document.addEventListener('blur', function(e){
    if(e.target.classList.contains('combo-input')) setTimeout(function(){ validarCampo(e.target,true); },120);
  }, true);
  document.addEventListener('change', function(e){
    if(e.target.classList.contains('combo-input')) validarCampo(e.target,true);
  }, true);
  document.addEventListener('paste', function(e){
    if(e.target.classList.contains('combo-input')) setTimeout(function(){ validarCampo(e.target,true); },80);
  }, true);

  // intercepta salvar() que serve para salvar E alterar no seu app.js
  function interceptarSalvar(){
    if(typeof window.salvar!== 'function') return false;
    if(window.salvar._jaInterceptado) return true;
    var orig=window.salvar;
    window.salvar=function(){
      if(!validarTodosCampos(true)){
        toastMsg('⚠️ Corrija os campos com ▼. Só aceita opção da lista.');
        return;
      }
      return orig.apply(this, arguments);
    };
    window.salvar._jaInterceptado=true;
    return true;
  }

  // tenta interceptar até conseguir (app.js carrega depois)
  var tent=0; var iv=setInterval(function(){
    if(interceptarSalvar() || tent>50) clearInterval(iv);
    tent++;
  },200);
  setTimeout(interceptarSalvar, 500);
  setTimeout(interceptarSalvar, 1500);

  // AUTO ACIONA O BOTÃO PESQUISE SÓ 1 VEZ AO ENTRAR
  function autoPesquise(){
    if(jaPesquisouAuto) return;
    jaPesquisouAuto=true;
    try{
      // espera MatriculaLogin ser preenchido pelo index.html
      var matLogin = (document.getElementById('MatriculaLogin')?.value || localStorage.getItem('mat_logada') || '').trim();
      if(matLogin){
        var inpMat=document.getElementById('Matricula');
        if(inpMat &&!inpMat.value) inpMat.value = matLogin.replace(/\D/g,'').padStart(5,'0');
      }
      if(typeof buscarMatriculaBD1==='function'){
        buscarMatriculaBD1();
      } else {
        var btn=document.getElementById('btnPesquiseMat');
        if(btn) btn.click();
      }
    }catch(e){}
  }

  window.addEventListener('load', function(){ setTimeout(autoPesquise, 800); });
  // fallback caso load já tenha passado
  setTimeout(function(){ if(!jaPesquisouAuto) autoPesquise(); }, 1500);
  setTimeout(function(){ if(!jaPesquisouAuto) autoPesquise(); }, 2500);

})();
</script>

</body>
</html>
